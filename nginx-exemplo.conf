# /etc/nginx/sites-available/camadas  (depois: ln -s ../sites-available/camadas /etc/nginx/sites-enabled/)
# Certificado: sudo certbot --nginx -d diagramas.seudominio.pt
server {
    listen 80;
    server_name diagramas.seudominio.pt;

    client_max_body_size 30m;   # importação de diagramas grandes e ficheiros anexados (acima de MAX_FILE_MB)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
